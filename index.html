
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado Fácil</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #222;
    }
    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 14px #0001;
    }
    h1 { color: #167447; text-align: center; }
    h2 { color: #167447; margin-top: 28px; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input, select {
      border: 1px solid #ccc;
      background: white;
    }
    button {
      border: 0;
      background: #167447;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .secundario { background: #526579; }
    .excluir { background: #b83232; }
    .produto, .venda {
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      background: #eef8f1;
      overflow-wrap: anywhere;
    }
    .resumo {
      padding: 14px;
      margin: 10px 0;
      border-radius: 8px;
      background: #e5f4eb;
      text-align: center;
      font-weight: bold;
    }
    .aviso { color: #a93226; }
    .vazio { color: #666; }
    .subtitulo { text-align: center; color: #526579; }
  </style>
</head>
<body>
  <main class="container">
    <h1>🛒 Mercado Fácil</h1>
    <p class="subtitulo">Cadastro, estoque e controle de vendas</p>

    <h2>📦 Cadastrar produto</h2>
    <input id="nome" placeholder="Nome do produto">
    <input id="preco" type="number" min="0" step="0.01"
      placeholder="Preço de venda (R$)">
    <input id="estoque" type="number" min="0" step="1"
      placeholder="Quantidade em estoque">
    <button onclick="cadastrar()">Cadastrar produto</button>
    <button class="secundario" onclick="limparFormulario()">
      Limpar campos
    </button>

    <h2>📋 Produtos cadastrados</h2>
    <div id="resumoEstoque" class="resumo"></div>
    <div id="lista"></div>

    <h2>🧾 Registrar venda</h2>
    <label for="produtoVenda">Escolha o produto</label>
    <select id="produtoVenda"></select>
    <input id="quantidadeVenda" type="number" min="1" step="1"
      placeholder="Quantidade vendida">
    <div id="previsao" class="resumo">
      Selecione um produto
    </div>
    <button onclick="registrarVenda()">Registrar venda</button>
    <p id="mensagem" role="status"></p>

    <h2>💰 Resumo das vendas</h2>
    <div id="totalVendido" class="resumo"></div>
    <div id="relatorioHoje" class="resumo"></div>

    <h2>📚 Histórico de vendas</h2>
    <div id="historico"></div>
  </main>

  <script>
    function lerDados(chave) {
      try {
        const dados = JSON.parse(localStorage.getItem(chave) || "[]");
        return Array.isArray(dados) ? dados : [];
      } catch (erro) {
        return [];
      }
    }

    let produtos = lerDados("mercadoFacil");
    let vendas = lerDados("mercadoFacilVendas");

    function dinheiro(valor) {
      return Number(valor).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function salvarProdutos() {
      localStorage.setItem("mercadoFacil", JSON.stringify(produtos));
    }

    function salvarVendas() {
      localStorage.setItem("mercadoFacilVendas", JSON.stringify(vendas));
    }

    function limparFormulario() {
      document.getElementById("nome").value = "";
      document.getElementById("preco").value = "";
      document.getElementById("estoque").value = "";
      document.getElementById("nome").focus();
    }

    function cadastrar() {
      const nome = document.getElementById("nome").value.trim();
      const campoPreco = document.getElementById("preco").value;
      const campoEstoque = document.getElementById("estoque").value;
      const preco = Number(campoPreco);
      const estoque = Number(campoEstoque);

      if (!nome || campoPreco === "" || campoEstoque === "" ||
          !Number.isFinite(preco) || preco < 0 ||
          !Number.isInteger(estoque) || estoque < 0) {
        alert("Preencha todos os campos corretamente.");
        return;
      }

      const duplicado = produtos.some(p =>
        p.nome.trim().toLowerCase() === nome.toLowerCase()
      );

      if (duplicado) {
        alert("Esse nome já está cadastrado. Escolha outro nome.");
        return;
      }

      produtos.push({ nome: nome, preco: preco, estoque: estoque });
      salvarProdutos();
      limparFormulario();
      atualizar();
      alert("Produto cadastrado com sucesso!");
    }

    function excluir(indice) {
      const nome = produtos[indice].nome;
      const temVenda = vendas.some(v => v.produto === nome);

      if (temVenda) {
        alert("Há vendas desse produto no histórico. Não é possível excluí-lo.");
        return;
      }

      if (confirm("Deseja excluir este produto?")) {
        produtos.splice(indice, 1);
        salvarProdutos();
        atualizar();
      }
    }

    function registrarVenda() {
      const campo = document.getElementById("produtoVenda");
      const quantidadeCampo = document.getElementById("quantidadeVenda");
      const indice = Number(campo.value);
      const quantidade = Number(quantidadeCampo.value);
      const mensagem = document.getElementById("mensagem");

      mensagem.textContent = "";
      mensagem.className = "";

      if (campo.value === "" || !produtos[indice]) {
        mensagem.textContent = "Cadastre ou selecione um produto.";
        mensagem.className = "aviso";
        return;
      }

      if (quantidadeCampo.value === "" ||
          !Number.isInteger(quantidade) || quantidade < 1) {
        mensagem.textContent = "Informe uma quantidade inteira maior que zero.";
        mensagem.className = "aviso";
        return;
      }

      const produto = produtos[indice];

      if (quantidade > produto.estoque) {
        mensagem.textContent =
          "Estoque insuficiente. Disponível: " + produto.estoque + ".";
        mensagem.className = "aviso";
        return;
      }

      const total = Math.round(produto.preco * quantidade * 100) / 100;
      const agora = new Date();

      vendas.unshift({
        produto: produto.nome,
        quantidade: quantidade,
        precoUnitario: produto.preco,
        total: total,
        data: agora.toLocaleString("pt-BR"),
        dataISO: agora.getFullYear() + "-" +
          String(agora.getMonth() + 1).padStart(2, "0") + "-" +
          String(agora.getDate()).padStart(2, "0")
      });

      produto.estoque -= quantidade;
      salvarProdutos();
      salvarVendas();

      quantidadeCampo.value = "";
      mensagem.textContent = "Venda registrada com sucesso!";
      atualizar();
    }

    function dataDaVenda(venda) {
      if (venda.dataISO) return venda.dataISO;

      // Compatibilidade com vendas antigas no formato brasileiro.
      const resultado = (venda.data || "").match(
        /^(\d{2})\/(\d{2})\/(\d{4})/
      );

      if (resultado) {
        return resultado[3] + "-" + resultado[2] + "-" + resultado[1];
      }

      return "";
    }

    function atualizarPrevisao() {
      const campo = document.getElementById("produtoVenda");
      const quantidadeCampo = document.getElementById("quantidadeVenda");
      const previsao = document.getElementById("previsao");
      const indice = Number(campo.value);
      const quantidade = Number(quantidadeCampo.value);

      if (campo.value === "" || !produtos[indice]) {
        previsao.textContent = "Cadastre um produto para começar.";
        return;
      }

      const produto = produtos[indice];

      if (quantidadeCampo.value === "" ||
          !Number.isInteger(quantidade) || quantidade < 1) {
        previsao.textContent = "Preço unitário: " + dinheiro(produto.preco);
        return;
      }

      previsao.textContent = "Total desta venda: " +
        dinheiro(produto.preco * quantidade);
    }

    function adicionarTexto(pai, tag, texto) {
      const elemento = document.createElement(tag);
      elemento.textContent = texto;
      pai.appendChild(elemento);
      return elemento;
    }

    function atualizar() {
      const lista = document.getElementById("lista");
      const resumoEstoque = document.getElementById("resumoEstoque");
      const seletor = document.getElementById("produtoVenda");
      const historico = document.getElementById("historico");

      lista.replaceChildren();
      seletor.replaceChildren();
      historico.replaceChildren();

      let unidades = 0;

      produtos.forEach((p, i) => {
        unidades += p.estoque;

        const item = document.createElement("div");
        item.className = "produto";

        adicionarTexto(item, "p",
          p.nome + " — " + dinheiro(p.preco) +
          " | Estoque: " + p.estoque);

        const botao = adicionarTexto(item, "button", "Excluir produto");
        botao.className = "excluir";
        botao.onclick = () => excluir(i);
        lista.appendChild(item);

        const opcao = document.createElement("option");
        opcao.value = String(i);
        opcao.textContent = p.nome + " — " + dinheiro(p.preco) +
          " (Estoque: " + p.estoque + ")";
        opcao.disabled = p.estoque < 1;
        seletor.appendChild(opcao);
      });

      resumoEstoque.textContent = "Produtos: " + produtos.length +
        " | Unidades em estoque: " + unidades;

      if (produtos.length === 0) {
        const opcao = document.createElement("option");
        opcao.value = "";
        opcao.textContent = "Cadastre um produto primeiro";
        seletor.appendChild(opcao);
      }

      let totalGeral = 0;
      vendas.forEach(v => totalGeral += Number(v.total) || 0);

      document.getElementById("totalVendido").textContent =
        "Total vendido: " + dinheiro(totalGeral) +
        " | Vendas registradas: " + vendas.length;

      const hoje = new Date();
      const hojeISO = hoje.getFullYear() + "-" +
        String(hoje.getMonth() + 1).padStart(2, "0") + "-" +
        String(hoje.getDate()).padStart(2, "0");

      const vendasHoje = vendas.filter(v => dataDaVenda(v) === hojeISO);
      const totalHoje = vendasHoje.reduce(
        (soma, v) => soma + (Number(v.total) || 0), 0
      );

      document.getElementById("relatorioHoje").textContent =
        "Hoje: " + dinheiro(totalHoje) +
        " | Vendas de hoje: " + vendasHoje.length;

      if (vendas.length === 0) {
        adicionarTexto(historico, "p", "Nenhuma venda registrada ainda.")
          .className = "vazio";
      } else {
        vendas.forEach(v => {
          const item = document.createElement("div");
          item.className = "venda";
          adicionarTexto(item, "strong", v.produto);
          adicionarTexto(item, "p",
            "Quantidade: " + v.quantidade + " × " +
            dinheiro(v.precoUnitario));
          adicionarTexto(item, "p", "Total: " + dinheiro(v.total));
          adicionarTexto(item, "small", v.data || "Data não informada");
          historico.appendChild(item);
        });
      }

      atualizarPrevisao();
    }

    document.getElementById("produtoVenda")
      .addEventListener("change", atualizarPrevisao);
    document.getElementById("quantidadeVenda")
      .addEventListener("input", atualizarPrevisao);

    atualizar();
  </script>
</body>
</html>
