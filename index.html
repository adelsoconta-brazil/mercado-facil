<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado Fácil</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0001;
    }
    h1 { color: #167447; text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 6px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #167447;
      color: white;
      border: 0;
      font-weight: bold;
    }
    .produto {
      padding: 12px;
      margin-top: 10px;
      background: #eef8f1;
      border-radius: 8px;
    }
    .excluir { background: #c0392b; }
    .resumo { text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 Mercado Fácil</h1>
    <p class="resumo">Cadastro e controle de produtos</p>

    <h3>Novo produto</h3>
    <input id="nome" placeholder="Nome do produto">
    <input id="preco" type="number" min="0" step="0.01"
      placeholder="Preço (R$)">
    <input id="estoque" type="number" min="0" step="1"
      placeholder="Quantidade em estoque">
    <button onclick="cadastrar()">Cadastrar produto</button>

    <p id="resumo" class="resumo"></p>
    <h3>Produtos cadastrados</h3>
    <div id="lista"></div>
  </div>

  <script>
    let produtos = JSON.parse(
      localStorage.getItem("mercadoFacil") || "[]"
    );

    function salvar() {
      localStorage.setItem("mercadoFacil", JSON.stringify(produtos));
      mostrar();
    }

    function cadastrar() {
      const nome = document.getElementById("nome").value.trim();
      const preco = Number(document.getElementById("preco").value);
      const estoque = Number(document.getElementById("estoque").value);

      if (!nome || document.getElementById("preco").value === "" ||
          document.getElementById("estoque").value === "" ||
          preco < 0 || estoque < 0 || !Number.isInteger(estoque)) {
        alert("Preencha os campos corretamente.");
        return;
      }

      produtos.push({ nome, preco, estoque });
      salvar();

      document.getElementById("nome").value = "";
      document.getElementById("preco").value = "";
      document.getElementById("estoque").value = "";
    }

    function excluir(indice) {
      produtos.splice(indice, 1);
      salvar();
    }

    function mostrar() {
      const lista = document.getElementById("lista");
      lista.innerHTML = "";

      let unidades = 0;
      produtos.forEach((p, i) => {
        unidades += p.estoque;
        const item = document.createElement("div");
        item.className = "produto";

        const descricao = document.createElement("p");
        descricao.textContent = p.nome + " — R$ " +
          p.preco.toFixed(2).replace(".", ",") +
          " | Estoque: " + p.estoque;

        const botao = document.createElement("button");
        botao.className = "excluir";
        botao.textContent = "Excluir produto";
        botao.onclick = () => excluir(i);

        item.append(descricao, botao);
        lista.appendChild(item);
      });

      document.getElementById("resumo").textContent =
        "Produtos: " + produtos.length +
        " | Unidades em estoque: " + unidades;
    }

    mostrar();
  </script>
</body>
</html>
