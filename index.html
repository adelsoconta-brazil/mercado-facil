<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado Fácil</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#f0f4f8;color:#222}
.container{max-width:800px;margin:auto}
header{background:#14532d;color:white;padding:22px;border-radius:14px}
header h1{margin:0 0 8px}
header p{margin:0}
section{background:white;padding:18px;margin-top:16px;border-radius:12px;box-shadow:0 3px 12px #0001}
h2{color:#167447;margin-top:0;font-size:20px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;font-size:16px;background:white}
button{padding:12px;border:0;border-radius:7px;font-size:15px;font-weight:bold;cursor:pointer;margin:5px 4px 5px 0}
.primary{background:#167447;color:white}
.secondary{background:#526579;color:white}
.danger{background:#b83232;color:white}
.product,.sale{padding:12px 0;border-bottom:1px solid #ddd;overflow-wrap:anywhere}
.summary{background:#e5f4eb;padding:14px;margin:10px 0;border-radius:8px;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:#f0fdf4;padding:12px;border-radius:8px}
.stat span{display:block;font-size:13px;color:#526579}
.stat strong{display:block;margin-top:6px;color:#166534;font-size:19px}
.muted{color:#64748b;font-size:14px}
.warning{color:#a93226}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="container">
<header>
<h1>🛒 Mercado Fácil</h1>
<p>Cadastro, estoque e controle de vendas</p>
</header>

<section>
<h2>📦 Cadastrar produto</h2>
<form id="formProduto">
<label for="nome">Nome do produto</label>
<input id="nome" required placeholder="Ex.: Arroz">
<label for="preco">Preço de venda (R$)</label>
<input id="preco" type="number" min="0.01" step="0.01" required placeholder="25,00">
<label for="estoque">Quantidade em estoque</label>
<input id="estoque" type="number" min="0" step="1" required placeholder="10">
<button class="primary" type="submit">Cadastrar produto</button>
<button class="secondary" id="limpar" type="button">Limpar campos</button>
</form>
</section>

<section>
<h2>📋 Produtos cadastrados</h2>
<label for="busca">🔎 Buscar produto</label>
<input id="busca" placeholder="Digite o nome do produto">
<p id="resumoEstoque" class="muted"></p>
<div id="lista"></div>
</section>

<section>
<h2>🧾 Registrar venda</h2>
<label for="produtoVenda">Escolha o produto</label>
<select id="produtoVenda"></select>
<p id="previsao" class="summary">Selecione um produto</p>
<label for="quantidadeVenda">Quantidade vendida</label>
<input id="quantidadeVenda" type="number" min="1" step="1" placeholder="Ex.: 2">
<button class="primary" id="registrar" type="button">Registrar venda</button>
<p id="mensagem" role="status"></p>
</section>

<section>
<h2>💰 Resumo das vendas</h2>
<div class="stats">
<div class="stat"><span>Total vendido</span><strong id="totalGeral">R$ 0,00</strong></div>
<div class="stat"><span>Vendas registradas</span><strong id="qtdGeral">0</strong></div>
<div class="stat"><span>Vendido hoje</span><strong id="totalHoje">R$ 0,00</strong></div>
<div class="stat"><span>Vendas de hoje</span><strong id="qtdHoje">0</strong></div>
</div>
</section>

<section>
<h2>📚 Histórico de vendas</h2>
<div id="historico"></div>
</section>
</main>

<script>
const CHAVE_PRODUTOS = "mercadoFacil";
const CHAVE_VENDAS = "mercadoFacilVendas";

function lerDados(chave){
  try{
    const valor=JSON.parse(localStorage.getItem(chave)||"[]");
    return Array.isArray(valor)?valor:[];
  }catch(e){return [];}
}

let produtos=lerDados(CHAVE_PRODUTOS);
let vendas=lerDados(CHAVE_VENDAS);

function dinheiro(n){
  return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function chaveNome(nome){
  return String(nome||"").trim().toLocaleLowerCase("pt-BR");
}
function salvar(){
  localStorage.setItem(CHAVE_PRODUTOS,JSON.stringify(produtos));
  localStorage.setItem(CHAVE_VENDAS,JSON.stringify(vendas));
}

/* Consolida produtos repetidos e soma os estoques.
   Preserva as vendas existentes sem registrá-las novamente. */
function consolidarDuplicados(){
  const mapa=new Map();
  produtos.forEach((p,i)=>{
    const nome=String(p.nome||p.produto||"").trim();
    if(!nome)return;
    const chave=chaveNome(nome);
    const estoque=Math.max(0,Number(p.estoque)||0);
    const preco=Number(p.preco??p.precoUnitario)||0;

    if(!mapa.has(chave)){
      mapa.set(chave,{
        id:p.id??("produto-"+i+"-"+chave),
        nome:nome,
        preco:preco,
        estoque:estoque
      });
    }else{
      mapa.get(chave).estoque+=estoque;
    }
  });
  produtos=Array.from(mapa.values());
  salvar();
}

function dataLocalISO(data){
  const d=new Date(data);
  if(Number.isNaN(d.getTime()))return "";
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dataVendaISO(v){
  if(v.dataISO && /^\d{4}-\d{2}-\d{2}$/.test(v.dataISO))return v.dataISO;
  const original=String(v.data||v.dataVenda||v.dataHora||"");
  const br=original.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(br)return br[3]+"-"+br[2]+"-"+br[1];
  return dataLocalISO(original);
}
function nomeVenda(v){
  return v.produto||v.nome||v.produtoNome||"Produto";
}
function precoVenda(v){
  return Number(v.precoUnitario??v.preco)||0;
}
function quantidadeVenda(v){
  return Number(v.quantidade)||0;
}
function totalVenda(v){
  if(v.total!==undefined)return Number(v.total)||0;
  return precoVenda(v)*quantidadeVenda(v);
}

function renderizarProdutos(){
  const busca=chaveNome(document.getElementById("busca").value);
  const lista=document.getElementById("lista");
  lista.replaceChildren();

  const unidades=produtos.reduce((s,p)=>s+(Number(p.estoque)||0),0);
  document.getElementById("resumoEstoque").textContent=
    "Produtos: "+produtos.length+" | Unidades em estoque: "+unidades;

  const filtrados=produtos.filter(p=>chaveNome(p.nome).includes(busca));
  if(!filtrados.length){
    const vazio=document.createElement("p");
    vazio.className="muted";
    vazio.textContent="Nenhum produto encontrado.";
    lista.appendChild(vazio);
  }

  filtrados.forEach(p=>{
    const item=document.createElement("div");
    item.className="product";
    const info=document.createElement("p");
    info.textContent=p.nome+" — "+dinheiro(p.preco)+" | Estoque: "+p.estoque;
    const botao=document.createElement("button");
    botao.className="danger";
    botao.textContent="Excluir produto";
    botao.type="button";
    botao.onclick=()=>{
      if(vendas.some(v=>chaveNome(nomeVenda(v))===chaveNome(p.nome))){
        alert("Esse produto tem vendas no histórico. Não é possível excluí-lo.");
        return;
      }
      if(confirm("Deseja excluir "+p.nome+"?")){
        produtos=produtos.filter(x=>x.id!==p.id);
        salvar();
        atualizar();
      }
    };
    item.append(info,botao);
    lista.appendChild(item);
  });

  const seletor=document.getElementById("produtoVenda");
  const anterior=seletor.value;
  seletor.replaceChildren();
  if(!produtos.length){
    const op=document.createElement("option");
    op.value="";
    op.textContent="Cadastre um produto primeiro";
    seletor.appendChild(op);
  }else{
    produtos.forEach(p=>{
      const op=document.createElement("option");
      op.value=String(p.id);
      op.textContent=p.nome+" — "+dinheiro(p.preco)+" (Estoque: "+p.estoque+")";
      op.disabled=p.estoque<1;
      seletor.appendChild(op);
    });
    if(produtos.some(p=>String(p.id)===anterior))seletor.value=anterior;
  }
  atualizarPrevisao();
}

function atualizarPrevisao(){
  const id=document.getElementById("produtoVenda").value;
  const p=produtos.find(x=>String(x.id)===id);
  const qtdCampo=document.getElementById("quantidadeVenda");
  const qtd=Number(qtdCampo.value);
  const saida=document.getElementById("previsao");
  if(!p){saida.textContent="Cadastre um produto para começar.";return;}
  if(qtdCampo.value===""||!Number.isInteger(qtd)||qtd<1){
    saida.textContent="Preço unitário: "+dinheiro(p.preco);
    return;
  }
  saida.textContent="Total desta venda: "+dinheiro(p.preco*qtd);
}

function renderizarVendas(){
  document.getElementById("totalGeral").textContent=
    dinheiro(vendas.reduce((s,v)=>s+totalVenda(v),0));
  document.getElementById("qtdGeral").textContent=vendas.length;

  const hoje=dataLocalISO(new Date());
  const deHoje=vendas.filter(v=>dataVendaISO(v)===hoje);
  document.getElementById("totalHoje").textContent=
    dinheiro(deHoje.reduce((s,v)=>s+totalVenda(v),0));
  document.getElementById("qtdHoje").textContent=deHoje.length;

  const historico=document.getElementById("historico");
  historico.replaceChildren();
  if(!vendas.length){
    const vazio=document.createElement("p");
    vazio.className="muted";
    vazio.textContent="Nenhuma venda registrada ainda.";
    historico.appendChild(vazio);
    return;
  }

  vendas.forEach(v=>{
    const item=document.createElement("div");
    item.className="sale";
    const nome=document.createElement("strong");
    nome.textContent=nomeVenda(v);
    const detalhe=document.createElement("p");
    detalhe.textContent="Quantidade: "+quantidadeVenda(v)+" × "+dinheiro(precoVenda(v));
    const total=document.createElement("p");
    total.textContent="Total: "+dinheiro(totalVenda(v));
    const data=document.createElement("p");
    data.className="muted";
    data.textContent=v.data||v.dataVenda||v.dataHora||"Data não informada";
    item.append(nome,detalhe,total,data);
    historico.appendChild(item);
  });
}

function atualizar(){
  renderizarProdutos();
  renderizarVendas();
}

document.getElementById("formProduto").addEventListener("submit",e=>{
  e.preventDefault();
  const nome=document.getElementById("nome").value.trim();
  const precoCampo=document.getElementById("preco").value;
  const estoqueCampo=document.getElementById("estoque").value;
  const preco=Number(precoCampo);
  const estoque=Number(estoqueCampo);

  if(!nome||precoCampo===""||!Number.isFinite(preco)||preco<=0||
     estoqueCampo===""||!Number.isInteger(estoque)||estoque<0){
    alert("Preencha todos os campos corretamente.");
    return;
  }
  if(produtos.some(p=>chaveNome(p.nome)===chaveNome(nome))){
    alert("Esse produto já está cadastrado. Use a busca para localizá-lo.");
    return;
  }
  produtos.push({id:"produto-"+Date.now(),nome,preco,estoque});
  salvar();
  e.target.reset();
  atualizar();
  alert("Produto cadastrado com sucesso!");
});

document.getElementById("limpar").addEventListener("click",()=>{
  document.getElementById("formProduto").reset();
  document.getElementById("nome").focus();
});
document.getElementById("busca").addEventListener("input",renderizarProdutos);
document.getElementById("produtoVenda").addEventListener("change",atualizarPrevisao);
document.getElementById("quantidadeVenda").addEventListener("input",atualizarPrevisao);

document.getElementById("registrar").addEventListener("click",()=>{
  const p=produtos.find(x=>String(x.id)===document.getElementById("produtoVenda").value);
  const campo=document.getElementById("quantidadeVenda");
  const qtd=Number(campo.value);
  const msg=document.getElementById("mensagem");
  msg.className="";
  msg.textContent="";

  if(!p){msg.textContent="Cadastre ou selecione um produto.";msg.className="warning";return;}
  if(campo.value===""||!Number.isInteger(qtd)||qtd<1){
    msg.textContent="Informe uma quantidade inteira maior que zero.";
    msg.className="warning";return;
  }
  if(qtd>p.estoque){
    msg.textContent="Estoque insuficiente. Disponível: "+p.estoque+".";
    msg.className="warning";return;
  }

  const agora=new Date();
  const total=Math.round(p.preco*qtd*100)/100;
  p.estoque-=qtd;
  vendas.unshift({
    produto:p.nome,
    quantidade:qtd,
    precoUnitario:p.preco,
    total:total,
    data:agora.toLocaleString("pt-BR"),
    dataISO:dataLocalISO(agora)
  });
  salvar();
  campo.value="";
  msg.textContent="Venda registrada com sucesso!";
  atualizar();
});

consolidarDuplicados();
atualizar();
</script>
</body>
</html>
