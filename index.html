
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado Fácil</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172b4d;
    }
    header {
      background: #17365d;
      color: white;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
    }
    main { max-width: 800px; margin: 20px auto; }
    section {
      background: white;
      margin: 16px 0;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0000000c;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    .produto {
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .produto button { background: #b42332; }
    .resumo { font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Mercado Fácil</h1>
    <p>Sistema de controle de produtos e vendas</p>
  </header>

  <main>
    <section>
      <h2>📦 Cadastrar produto</h2>
      <input id="nome" placeholder="Nome do produto">
      <input id="preco" type="number" min="0.01" step="0.01" placeholder="Preço (R$)">
      <input id="estoque" type="number" min="0" step="1" placeholder="Quantidade em estoque">
      <button onclick="cadastrar()">Cadastrar produto</button>
    </section>

    <section>
      <h2>📊 Resumo</h2>
      <p class="resumo" id="resumo">Produtos cadastrados: 0</p>
      <p id="unidades">Unidades em estoque: 0</p>
    </section>

    <section>
      <h2>🧾 Produtos cadastrados</h2>
      <div id="lista">Nenhum produto cadastrado.</div>
    </section>
  </main>

  <script>
    let produtos = [];

    try {
      produtos = JSON.parse(localStorage.getItem("mercadoFacil")) || [];
    } catch (e) {
      produtos = [];
    }

    function salvar() {
      try {
        localStorage.setItem("mercadoFacil", JSON.stringify(produtos));
      } catch (e) {
        alert("Não foi possível salvar neste navegador.");
      }
    }

    function dinheiro(valor) {
      return Number(valor).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function cadastrar() {
      const nome = document.getElementById("nome").value.trim();
      const preco = Number(document.getElementById("preco").value);
      const estoqueTexto = document.getElementById("estoque").value;
      const estoque = Number(estoqueTexto);

      if (!nome || !document.getElementById("preco").value ||
          !estoqueTexto || !Number.isFinite(preco) ||
          preco <= 0 || !Number.isInteger(estoque) || estoque < 0) {
        alert("Preencha os campos corretamente.");
        return;
      }

      produtos.push({
        id: Date.now(),
        nome: nome,
        preco: preco,
        estoque: estoque
      });

      salvar();
      mostrar();

      document.getElementById("nome").value = "";
      document.getElementById("preco").value = "";
      document.getElementById("estoque").value = "";
    }

    function excluir(id) {
      if (!confirm("Deseja excluir este produto?")) return;
      produtos = produtos.filter(p => p.id !== id);
      salvar();
      mostrar();
    }

    function mostrar() {
      const lista = document.getElementById("lista");
      lista.replaceChildren();

      if (produtos.length === 0) {
        lista.textContent = "Nenhum produto cadastrado.";
      }

      produtos.forEach(p => {
        const item = document.createElement("div");
        item.className = "produto";

        const nome = document.createElement("strong");
        nome.textContent = p.nome;

        const detalhe = document.createElement("p");
        detalhe.textContent = dinheiro(p.preco) +
          " | Estoque: " + p.estoque;

        const botao = document.createElement("button");
        botao.textContent = "Excluir produto";
        botao.onclick = () => excluir(p.id);

        item.append(nome, detalhe, botao);
        lista.appendChild(item);
      });

      document.getElementById("resumo").textContent =
        "Produtos cadastrados: " + produtos.length;

      document.getElementById("unidades").textContent =
        "Unidades em estoque: " +
        produtos.reduce((total, p) => total + p.estoque, 0);
    }

    mostrar();
  </script>
</body>
</html>
